version: '3.8'

services:
  # ── PostgreSQL Database ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: junction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: junction_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d junction_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: junction-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/junction_dev
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgrespassword
      JUNCTION_EDGE_DEVICE_SECRET: ${JUNCTION_EDGE_DEVICE_SECRET:-dev-local-secret-not-for-production}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js Frontend ───────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: junction-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080
      PORT: 3000

volumes:
  postgres-data:

