# ============================================================
#  JUNCTION Backend — application.yml
#  Spring Boot 4.1.2 | Java 21 | PostgreSQL | Flyway | Clerk JWT
#
#  Active profiles:
#    dev  — local development (Testcontainers / local PostgreSQL)
#    prod — Railway / Docker production deployment
#
#  IMPORTANT: Never put real secrets in this file.
#             Use environment variables or Kubernetes secrets.
#             See .env.example for required environment variables.
# ============================================================

spring:
  application:
    name: junction-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── JPA / Hibernate ──────────────────────────────────────
  jpa:
    # Flyway owns DDL — Hibernate only validates against established schema
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Virtual threads friendly — disable connection acquisition timeout adjustments
        connection:
          provider_disables_autocommit: true
        # Batch operations for audit event bulk inserts
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  # ── Flyway ───────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false          # Set true only when baselining existing live DB
    out-of-order: false
    validate-on-migrate: true
    # Table name uses underscore convention to match Drizzle ORM naming
    table: flyway_schema_history

  # ── Cache (Caffeine) ──────────────────────────────────────
  cache:
    type: caffeine
    caffeine:
      # Default spec — individual caches configured in CacheConfig.java
      spec: maximumSize=500,expireAfterWrite=600s

  # ── Async Executor ────────────────────────────────────────
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 1000
      thread-name-prefix: junction-async-
    scheduling:
      thread-name-prefix: junction-scheduler-

# ── Server ──────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  # Compression
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  # Tomcat tuning for Java 21 virtual threads
  tomcat:
    threads:
      max: 200
      min-spare: 10

# ── Actuator ────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  info:
    env:
      enabled: true

# ── Application Info ─────────────────────────────────────────
info:
  app:
    name: JUNCTION Backend
    version: 1.0.0
    description: Intelligent Destination Orchestration Platform — Spring Boot Backend
    java-version: ${java.version}

# ── Logging ─────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.junction: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ── Junction Application Configuration ────────────────────────
junction:
  # Clerk authentication
  security:
    clerk:
      # Clerk JWKS endpoint — public key set for JWT verification
      # Format: https://<your-clerk-domain>/.well-known/jwks.json
      jwks-uri: ${CLERK_JWKS_URI}
      # Expected JWT issuer (matches iss claim in Clerk tokens)
      issuer-uri: ${CLERK_ISSUER_URI}

    # Edge device authentication (cv_bridge ingestion)
    edge-device:
      # Shared secret for edge device API key authentication
      # Devices must send: Authorization: Bearer <JUNCTION_EDGE_DEVICE_SECRET>
      secret: ${JUNCTION_EDGE_DEVICE_SECRET}

  # Domain engine parameters (mirror TypeScript source of truth)
  ingestion:
    dedup-cache-max-size: 2000
    stale-threshold-seconds: 180
    stale-confidence-multiplier: 0.7
    ring-buffer-capacity: 200

  recommendation:
    cooldown-ms: 300000              # 5 minutes — mirrors TypeScript COOLDOWN_MS

  # Cors — origins are refined per profile in application-dev/prod.yml
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

